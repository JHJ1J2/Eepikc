    <script>
      // Production security gate: the full application is rendered only after
      // the server verifies a real Telegram Mini App initData signature.
      (function () {
        function showGate() {
          if (document.getElementById('dur-telegram-gate')) return;
          var gate = document.createElement('div');
          gate.id = 'dur-telegram-gate';
          gate.innerHTML = '<div style="font-size:48px;margin-bottom:18px">✈️</div>' +
            '<div style="font-size:22px;font-weight:900;margin-bottom:10px">Open the bot via Telegram</div>' +
            '<div style="font-size:14px;color:#a7a7b2;line-height:1.5;max-width:330px;margin:0 auto 22px">This app can only be opened from Telegram.</div>' +
            '<button id="dur-open-telegram" type="button">Open the bot via Telegram</button>';
          document.body.appendChild(gate);
          var b = document.getElementById('dur-open-telegram');
          if (b) b.onclick = function () { window.location.href = 'https://t.me/Spammai'; };
        }
        function verify() {
          var tg = window.Telegram && window.Telegram.WebApp;
          var initData = tg && tg.initData ? String(tg.initData) : '';
          if (!initData) { showGate(); return; }
          fetch('/api/telegram/access', {
            method: 'GET',
            credentials: 'include',
            cache: 'no-store',
            headers: { 'X-Telegram-Init-Data': initData }
          }).then(function (r) { return r.json().catch(function(){ return {}; }); })
            .then(function (data) {
              if (data && data.ok === true) {
                document.body.classList.add('telegram-verified');
              } else {
                showGate();
              }
            })
            .catch(function () { showGate(); });
        }
        window.addEventListener('DOMContentLoaded', function () {
          // Telegram may populate initData just after the SDK script executes.
          setTimeout(verify, 80);
        });
      })();
    </script>

    <script>
      // Fullscreen setup - runs immediately
      const tg = window.Telegram?.WebApp;
      if (tg) {
        console.log('[TELEGRAM] Version:', tg.version);
        
        tg.ready();
        tg.expand();
        
        // Set header color to match app background (#000000)
        if (typeof tg.setHeaderColor === 'function') {
          tg.setHeaderColor('#242424');
          console.log('[TELEGRAM] ✅ Header color set');
        }
        
        if (typeof tg.setBackgroundColor === 'function') {
          tg.setBackgroundColor('#121212');
          console.log('[TELEGRAM] ✅ Background color set');
        }
        
        // Try requestFullscreen if available (v6.9+)
        if (typeof tg.requestFullscreen === 'function') {
          tg.requestFullscreen();
          console.log('[TELEGRAM] ✅ requestFullscreen() called');
        }
        
        // Keep Telegram vertical swipes enabled so the Home page can scroll.
        try {
          if (typeof tg.enableVerticalSwipes === 'function') tg.enableVerticalSwipes();
        } catch (e) {}
        
        // متغيّرات المساحة الآمنة تنضبط فوراً قبل ما يركّب React — نفس ما يسوّونه
        // بصفحتهم، حتى ما تقفز الواجهة أول ما تفتح
        try {
          var _p = tg.platform;
          if (_p === 'android' || _p === 'ios') {
            var _ins = tg.contentSafeAreaInset || tg.safeAreaInset || {};
            var _top = _ins.top || 0;
            if (_p === 'ios' && _top === 0 && tg.isFullscreen) _top = 47;
            var _bottom = _p === 'android' ? 16 : (_ins.bottom || 0);
            var _root = document.documentElement.style;
            _root.setProperty('--safe-area-top', _top + 'px');
            _root.setProperty('--safe-area-bottom', _bottom + 'px');
            _root.setProperty('--tma-top-bar-height', (_p === 'ios' ? 52 : 48) + 'px');
            _root.setProperty('--header-extra-offset', (_p === 'ios' ? 44 : 24) + 'px');
          }
          document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
        } catch (e) {}

        console.log('[TELEGRAM] ✅ Fullscreen setup complete');
      }
    </script>

  function compactTon(n){
    n=Number(n)||0;
    const abs=Math.abs(n);
    const formatScaled=(v,suffix='')=>{
      const a=Math.abs(v);
      if(a>=1000) return Math.round(v).toLocaleString('en-US')+suffix;
      if(a>=100) return v.toFixed(1)+suffix;
      return v.toFixed(2)+suffix;
    };
    if(abs>=1e15) return formatScaled(n/1e15,'Q');
    if(abs>=1e12) return formatScaled(n/1e12,'T');
    if(abs>=1e9) return formatScaled(n/1e9,'B');
    if(abs>=1e6) return formatScaled(n/1e6,'M');
    return formatScaled(n);
  }

  // Single client-side source of truth for Rocket gift tiers.
  // Every UI surface resolves from gift name + current catalog price + gift_prices.json.
  (function initDurGiftTierResolver(){
    const normalize=v=>{const n=Number(v);return Number.isFinite(n)?Math.round((n*100)+1e-9):null};
    window.__durNormalizeGiftPrice=normalize;
    window.__durGiftPrices=window.__durGiftPrices||{};
    window.__durGiftPricesReady=window.__durGiftPricesReady||fetch('/gift_prices.json',{cache:'no-store'}).then(r=>r.ok?r.json():{}).then(v=>{if(v&&typeof v==='object')window.__durGiftPrices=v;return window.__durGiftPrices}).catch(()=>window.__durGiftPrices);
    window.__durResolveGiftTier=(name,price)=>{
      const row=window.__durGiftPrices?.[String(name||'')];
      const p=normalize(price);
      if(!row||p===null)return 'normal';
      const onyx=normalize(row.onyx_black);
      if(onyx!==null&&onyx>0&&p===onyx)return 'onyx_black';
      const black=normalize(row.black);
      if(black!==null&&black>0&&p===black)return 'black';
      return 'normal';
    };
  })();

  (function durPersonalGameController(){

    const selfId=String(window.Telegram?.WebApp?.initDataUnsafe?.user?.id||'');

        markSelfCrashRow(!!active && !active.isWaiting && !didCash);
        return;
      }
      if(currentPhase==='countdown'||currentPhase==='flying') markSelfCrashRow(false);

    function durPaintCrashPlayers(){
      const rows=Array.from(document.querySelectorAll('[data-testid^="player-"]'));
      if(!rows.length)return;
      const groups=new Map();
      rows.forEach(row=>{
        const parent=row.parentElement;
        if(!parent)return;
        if(!groups.has(parent))groups.set(parent,[]);
        groups.get(parent).push(row);
      });
      groups.forEach((group,parent)=>{
        // React owns the actual colors. We only reorder final crash results.
        // On the participant's own device, their own card is permanently first
        // for the crash result. Everyone else keeps the existing cash-out/lost
        // ordering. This is intentionally client-local.
        const rank=row=>{
          const id=String(row?.dataset?.testid||'').replace(/^player-/,'');
          const isSelf=id===selfId;
          if(isSelf)return 0;
          return durIsCashoutRow(row)?1:(durIsLostRow(row)?2:3);
        };
        const ordered=group.slice().sort((a,b)=>rank(a)-rank(b));
        const sameOrder=ordered.length===group.length && ordered.every((row,i)=>row===group[i]);
        if(!sameOrder) ordered.forEach(row=>parent.appendChild(row));

    function updatePersonalGift(){
      const box=document.getElementById('dur-live-rocket'); if(!box)return;
      // The personal gift transformation applies to BOTH TON bets and gift bets.
      // A gift bet uses its own stored TON value; a TON bet uses stake * multiplier.
      if(currentPhase!=='flying'||!selfBet||selfBet.isWaiting){resetPersonalGift();return}
      const isGiftBet=!!selfBet.giftId;
      const stakeTon=Number(isGiftBet ? selfBet.giftValueTon : (Number(selfBet.betAmount||0)/1e9));
      const liveMult=Number(window.__durLiveMultiplier||currentMult||1);
      const value=stakeTon*liveMult;
      if(!(value>=3.5-1e-9)){resetPersonalGift();return}

      // Gift bets use the same live conversion ladder as TON bets.
      // The displayed gift must change whenever the multiplied value crosses
      // another gift tier, instead of staying on the originally wagered image.
      if(!tiers.length)return;
      const usable=tiers.filter(x=>Number(x.priceTON)>0).sort((a,b)=>Number(a.priceTON)-Number(b.priceTON));

      // price must match gift_prices.json. Never inherit the previous tier.
      const currentPrice=Number(tier.priceTON);
      const giftTier=window.__durResolveGiftTier(giftName,currentPrice);

      let label=box.querySelector('.dur-personal-gift-tier');
      if(giftTier==='normal'){
        label?.remove();
      }else{
        if(!label){
          label=document.createElement('div');
          label.className='dur-personal-gift-tier';
          box.appendChild(label);
        }
        label.textContent=giftTier==='onyx_black'?'Onyx Black':'Black';
        label.dataset.tier=giftTier;
      }
      g.dataset.durGiftTier=giftTier;
    }
    window.addEventListener('dur-rocket-ws',e=>{
      let d=e.detail;try{if(typeof d==='string')d=JSON.parse(d)}catch(_){return} if(!d)return;
      if(d.type==='state_snapshot'){
        const snapshotPhase=d.state?.phase||'';
        if(snapshotPhase==='countdown' && !durCurrentRocketAsset) chooseNextStellarRocket();
        currentPhase=snapshotPhase;currentMult=Number(d.state?.multiplier||1);
        selfBet=(d.state?.activePlayers||[]).find(p=>String(p.chatId)===selfId)||null;
        if(selfBet) lastRoundActiveBet=selfBet;
        // Waiting bets are intentionally never included in public snapshots.
        if(currentPhase==='countdown'&&!selfBet){durLocalCashedOut=false;resetPersonalGift();}
      }
      if(d.type==='phase_change'){
        const nextPhase=d.phase||'';
        if(nextPhase==='countdown'){
          durStopCrashPlayersMode();
          // Rocket selection is handled by the dedicated round listener below.
          durLocalCashedOut=false;selfBet=null;lastRoundActiveBet=null;resetPersonalGift();
        }
        currentPhase=nextPhase;currentMult=Number(d.multiplier||1);
        if(d.activePlayers){selfBet=(d.activePlayers||[]).find(p=>String(p.chatId)===selfId)||null;if(selfBet)lastRoundActiveBet=selfBet;}
      }
      if(d.type==='multiplier_update'){
        currentPhase='flying';currentMult=Number(d.multiplier||1);
        selfBet=(d.activePlayers||[]).find(p=>String(p.chatId)===selfId)||selfBet;
        if(selfBet)lastRoundActiveBet=selfBet;
      }
      if(d.type==='pending_bet_added' && d.player && String(d.player.chatId)===selfId){
        if(d.player.isWaiting){selfWaitingBet=d.player;setWaitingButtonMode(currentPhase==='crashed'||currentPhase==='countdown');}else{selfBet=d.player;lastRoundActiveBet=d.player;selfWaitingBet=null;setWaitingButtonMode(false);}
      }
      if(d.type==='self_roster_entry' && d.player && String(d.player.chatId)===selfId){
        selfBet=d.player;lastRoundActiveBet=d.player;selfWaitingBet=null;setWaitingButtonMode(false);
      }
      if(d.type==='bet_response' && d.success){
        if(d.waiting===true && !selfWaitingBet) selfWaitingBet={chatId:selfId,isWaiting:true,isPending:true,betAmount:0};
        if(d.waiting===false) selfWaitingBet=null;
        setTimeout(updateButton,30);
      }
      if(d.type==='bet_cancelled'){
        if(d.waiting) selfWaitingBet=null;
        else {selfBet=null;lastRoundActiveBet=null;}
        resetPersonalGift();
      }
      if(d.type==='pending_bet_rejected' && String(d.chatId)===selfId){
        selfWaitingBet=null;
        updateButton();
      }
      if(d.type==='player_cashed_out'){
        if(String(d.chatId)===selfId){
          if(selfBet){selfBet={...selfBet,cashedOut:true,cashOutMultiplier:Number(d.multiplier||0),winAmount:Number(d.winAmount||0)};lastRoundActiveBet=selfBet;}
          durLocalCashedOut=true;
          updateButton();
        }
      }
      if(d.type==='crash'){
        currentPhase='crashed';currentMult=Number(d.multiplier||currentMult);
        durStartCrashPlayersMode();
        if(selfWaitingBet){setWaitingButtonMode(true);}

        const active=(d.activePlayers||[]).find(p=>String(p.chatId)===selfId)||selfBet;
        if(active){selfBet=active;lastRoundActiveBet=active;}
        // Queued next-round bets are private and do not turn into a public crash row.
        const crashedBet=lastRoundActiveBet;
        if(crashedBet&&!crashedBet.isWaiting){
          const serverCashed=!!(crashedBet.cashedOut||crashedBet.cashOut||crashedBet.cash_out||crashedBet.cashOutAt||crashedBet.cash_out_at);
          const didCashOut=durLocalCashedOut||serverCashed;
          markSelfCrashRow(!didCashOut);
        }
        setTimeout(()=>{
          if(!selfWaitingBet){selfBet=null;}
          updateButton();
        },120);
      }
      updatePersonalGift();setTimeout(updateButton,0);
    },true);
    // Keep the gift image, small gift-box tier and the label synchronized while
    // the multiplier is moving. This is intentionally UI-only and does not
    // alter the game state or betting logic.
    setInterval(()=>{if(currentPhase==='flying')updatePersonalGift()},100);
    // Both the large center gift and the small player gift use the same
    // animation multiplier bucket. This removes visual drift between them.
    window.addEventListener('dur-gift-sync',()=>{
      if(currentPhase==='flying')updatePersonalGift();
    });
  })();

  async function bootExtra(){
    try{
      const r=await api('/api/admin/check-access');
      const isDeveloper=!!r.isDeveloper;
      window.__durIsDeveloper=isDeveloper;
      const bind=()=>{
        setupNav(isDeveloper);
        ensureDevTopButton();
        if(isDeveloper){
          const b=document.querySelector('[data-testid="button-epic-developer"]');
          if(b&&!b.dataset.durBound){b.dataset.durBound='1';b.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();openDev()},true)}
        }else{
          document.querySelectorAll('[data-testid="button-epic-developer"]').forEach(x=>x.remove());
        }
      };
      bind(); wireTopUp(); showTopGift(); new MutationObserver(()=>{bind();wireTopUp();showTopGift()}).observe(document.documentElement,{subtree:true,childList:true});
      if(location.pathname==='/backpack') openBackpack(false);
      else if(location.pathname==='/invite') openInvite(false);
      else if(location.pathname==='/leaderboard') openLeaderboard(false);
      else if(location.pathname==='/deposit' || location.pathname==='/topup') openDeposit(false);
      else if(location.pathname==='/developer' || location.pathname.startsWith('/developer/')) openDev(false);
      const clean=()=>document.querySelectorAll('button,a,[data-testid]').forEach(n=>{if((n.textContent||'').trim().toLowerCase()==='eren')n.remove()});
      clean();new MutationObserver(clean).observe(document.body,{subtree:true,childList:true});
      const gift=new URLSearchParams(location.search).get('gift');
      if(gift){const rr=await api('/api/gift-links/redeem',{method:'POST',body:JSON.stringify({code:gift})});if(rr.ok){sessionStorage.setItem('dur_redeemed_'+gift,'1');durToast(rr.message)}else durToast(rr.message||'لقد انتهت صلاحية الهدية')}
    }catch(e){console.warn('[DUR]',e)}
  }
  setTimeout(bootExtra,700);
})();
</script>

      @keyframes durRing{0%{opacity:.95;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(5)}}
      @keyframes durShock{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}25%{opacity:1}100%{transform:translate(-50%,-50%) scale(1.9);opacity:0}}
      @keyframes durSpark{0%{opacity:0;transform:rotate(var(--a,0deg)) translateY(-5px) scale(.4)}20%{opacity:1}100%{opacity:0;transform:rotate(var(--a,0deg)) translateY(-90px) scale(.9)}}
      @keyframes durStar{0%,100%{transform:scale(.5);opacity:.2}50%{transform:scale(1.5);opacity:.9}}
      @media(max-height:650px){#dur-live-rocket .dr-rocket{width:110px!important;height:110px!important}#dur-live-rocket .dr-flame{width:68px}}
      @media(prefers-reduced-motion:reduce){#dur-live-rocket .dr-rocket,#dur-live-rocket .dr-flame{animation:none}}
    `;
    document.head.appendChild(style);
  };

  function findPlaceBetButton(){
    const els=[...document.querySelectorAll('button,[role=button]')];
    return els.find(el=>/place\s*bet/i.test((el.textContent||'').trim()))||null;
  }
  function findGameRect(){
    // Use the actual bundled rocket canvas container first. This prevents the
    // overlay from ever anchoring itself to Place Bet or the player list.
    const game=[...document.querySelectorAll('div')].find(el=>{
      const c=el.className||'';
      const st=el.getAttribute('style')||'';
      return typeof c==='string' && c.includes('absolute') && c.includes('left-0') && c.includes('right-0') && c.includes('top-0') && c.includes('z-0') && st.includes('--canvas-max-h');
    });
    if(game){
      const r=game.getBoundingClientRect();
      if(r.width>200 && r.height>180) return {left:r.left,top:r.top,width:r.width,height:r.height};
    }
    const canvas=[...document.querySelectorAll('canvas')].find(c=>{const r=c.getBoundingClientRect();return r.width>180&&r.height>180;});
    if(canvas){const r=canvas.getBoundingClientRect();return {left:r.left,top:r.top,width:r.width,height:r.height};}
    const mult=document.querySelector('[data-testid="text-multiplier"]');
    if(mult){
      const r=mult.getBoundingClientRect();
      const h=Math.max(240,Math.min(430,r.top-90));
      return {left:0,top:Math.max(85,r.top-h),width:window.innerWidth,height:h};
    }
    return {left:0,top:95,width:window.innerWidth,height:Math.max(250,Math.min(390,window.innerHeight*.48))};
  }

  function positionRocketBox(){
    const box=document.getElementById('dur-live-rocket');if(!box)return;
    box.style.position='absolute';
    box.style.left='0';
    box.style.top='0';
    box.style.width='100%';
    box.style.height='100%';
  }

  function replaceGiftTitle(root=document.body){
    const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
    const nodes=[]; let n; while(n=walker.nextNode()) nodes.push(n);
    for(const node of nodes){
      if(/Epic\s+Gift/i.test(node.nodeValue||'')) node.nodeValue=(node.nodeValue||'').replace(/Epic\s+Gift/gi,'Gift');
    }
    root.querySelectorAll?.('[aria-label],[title]').forEach(el=>{for(const a of ['aria-label','title']){const v=el.getAttribute(a);if(v&&/Epic\s+Gift/i.test(v))el.setAttribute(a,v.replace(/Epic\s+Gift/gi,'Gift'))}});
  }
  function findRocketHost(){
    const game=[...document.querySelectorAll('div')].find(el=>{
      const c=el.className||'';
      const st=el.getAttribute('style')||'';
      return typeof c==='string' &&
        c.includes('absolute') && c.includes('left-0') &&
        c.includes('right-0') && c.includes('top-0') &&
        c.includes('z-0') && st.includes('--canvas-max-h');
    });
    if(game){
      const r=game.getBoundingClientRect();
      if(r.width>180 && r.height>150) return game;
    }
    const canvas=[...document.querySelectorAll('canvas')].find(c=>{
      const r=c.getBoundingClientRect();
      return r.width>180 && r.height>150;
    });
    return canvas ? (canvas.parentElement || canvas) : null;
  }

  
const DUR_STELLAR_ROCKETS = [
  'Stellar_Rocket_Assets/1_StarGiftAttributeModel_Pencil.tgs',
  'Stellar_Rocket_Assets/2_StarGiftAttributeModel_Flower_Power.tgs',
  'Stellar_Rocket_Assets/3_StarGiftAttributeModel_Planet_Express.tgs',
  'Stellar_Rocket_Assets/4_StarGiftAttributeModel_Baby_Carrot.tgs',
  'Stellar_Rocket_Assets/6_StarGiftAttributeModel_Banana.tgs',
  'Stellar_Rocket_Assets/7_StarGiftAttributeModel_Black_Wing.tgs',
  'Stellar_Rocket_Assets/8_StarGiftAttributeModel_Little_Journey.tgs',
  'Stellar_Rocket_Assets/9_StarGiftAttributeModel_Space_Veggie.tgs',
  'Stellar_Rocket_Assets/10_StarGiftAttributeModel_Lollipop.tgs',
  'Stellar_Rocket_Assets/11_StarGiftAttributeModel_Nostromo.tgs'
];
let durCurrentRocketAsset = null;
let durPreviousRocketAsset = null;
function chooseNextStellarRocket(){
  const pool = DUR_STELLAR_ROCKETS.filter(x=>x!==durPreviousRocketAsset);
  const chosen = (pool.length ? pool : DUR_STELLAR_ROCKETS)[Math.floor(Math.random()*((pool.length ? pool : DUR_STELLAR_ROCKETS).length))];
  durPreviousRocketAsset = chosen;
  durCurrentRocketAsset = chosen;
  return chosen;
}

function initRocketTgs(box, assetPath=durCurrentRocketAsset||DUR_STELLAR_ROCKETS[0]){
  if(!box)return;
  const host=box.querySelector('.dr-rocket-tgs');
  const fallback=box.querySelector('.dr-rocket-fallback');
  if(!host)return;
  host.__durRocketAsset=assetPath;

  // Keep exactly ONE TGS/Lottie instance alive. React can replace the game
  // container during rerenders; without this guard the old animation keeps
  // running and a new one is mounted on top of it, producing 2-3 rockets.
  const active=window.__durRocketTgsActive;
  if(active && active.host!==host){
    try{active.animation?.destroy?.()}catch(_){}
    try{active.host.innerHTML='';active.host.__durLottie=null}catch(_){}
    window.__durRocketTgsActive=null;
  }
  if(host.__durLottie)return;
  host.innerHTML='';

  const start=(animationData)=>{
    if(!animationData)return false;
    if(!window.DurLottie)return false;
    try{
      // A second start attempt must never create a second canvas.
      if(host.__durLottie)return true;
      host.innerHTML='';
      const animation=window.DurLottie.loadAnimation({
        container:host,
        renderer:'canvas',
        loop:true,
        autoplay:true,
        animationData,
        rendererSettings:{preserveAspectRatio:'xMidYMid meet',clearCanvas:true}
      });
      host.__durLottie=animation;
      window.__durRocketTgsActive={host,animation};
      animation.setSpeed?.(1);
      const reveal=()=>{if(fallback)fallback.style.visibility='hidden';};
      animation.addEventListener?.('DOMLoaded',reveal);
      animation.addEventListener?.('data_ready',reveal);
      return true;
    }catch(_){
      try{host.__durLottie?.destroy?.()}catch(__){}
      host.__durLottie=null;
      if(window.__durRocketTgsActive?.host===host)window.__durRocketTgsActive=null;
      return false;
    }
  };
  const fromJson=()=>fetch('/assets/rocket-pencil.json',{cache:'force-cache'})
    .then(r=>{if(!r.ok)throw new Error('rocket json '+r.status);return r.json()})
    .then(data=>{
      if(start(data))return;
      setTimeout(()=>start(data),150);
    }).catch(()=>{});
  const loadPencilFallback=()=>{
    if(assetPath==='Stellar_Rocket_Assets/1_StarGiftAttributeModel_Pencil.tgs')return fromJson();
    return fetch('/assets/Stellar_Rocket_Assets/1_StarGiftAttributeModel_Pencil.tgs',{cache:'force-cache'})
      .then(r=>{if(!r.ok)throw new Error('pencil fallback '+r.status);return r.arrayBuffer()})
      .then(buf=>{
        if(typeof DecompressionStream!=='function')return fromJson();
        return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text()
          .then(t=>waitForLottie(JSON.parse(t)));
      }).catch(()=>fromJson());
  };
  const waitForLottie=(data,tries=0)=>{
    if(start(data))return;
    if(tries<20){setTimeout(()=>waitForLottie(data,tries+1),100);return;}
    fromJson();
  };
  fetch('/assets/'+assetPath,{cache:'force-cache'})
    .then(r=>{if(!r.ok)throw new Error('rocket tgs '+r.status);return r.arrayBuffer()})
    .then(buf=>{
      if(typeof DecompressionStream==='function'){
        return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text()
          .then(t=>waitForLottie(JSON.parse(t)));
      }
      return loadPencilFallback();
    })
    .catch(loadPencilFallback);
}
function destroyRocketTgs(box){
  const host=box?.querySelector('.dr-rocket-tgs');
  if(host?.__durLottie){
    try{host.__durLottie.destroy()}catch(_){}
    host.__durLottie=null;
    host.__durRocketAsset=null;
    host.innerHTML='';
  }
  if(window.__durRocketTgsActive?.host===host)window.__durRocketTgsActive=null;
}

function setRocketAsset(assetPath){
  if(!assetPath)return;
  durCurrentRocketAsset=assetPath;
  const box=document.getElementById('dur-live-rocket');
  if(!box)return;
  const host=box.querySelector('.dr-rocket-tgs');
  if(!host)return;
  if(host.__durRocketAsset===assetPath && host.__durLottie)return;
  destroyRocketTgs(box);
  initRocketTgs(box,assetPath);
}

    function mountRocket(){
    if(!pathOk()) return;
    if(!durCurrentRocketAsset) chooseNextStellarRocket();
    const host=findRocketHost();
    if(!host) return;
    let box=document.getElementById('dur-live-rocket');
    if(!box){
      makeStyle();
      box=document.createElement('div');
      box.id='dur-live-rocket';
      box.innerHTML='<div class="dr-track"><div class="dr-stars"><span class="dr-star s1"></span><span class="dr-star s2"></span><span class="dr-star s3"></span><span class="dr-star s4"></span><span class="dr-star s5"></span><span class="dr-star s6"></span><span class="dr-star s7"></span></div><div class="dr-trail"></div><div class="dr-flame"></div><div class="dr-rocket" aria-label="Rocket"><img class="dr-rocket-fallback" src="/rocket-static.png?v=4" alt="Rocket"><div class="dr-rocket-tgs" aria-hidden="true"></div></div><div class="dr-crash"><div class="dr-boom"><span class="boom-core"></span></div><div class="dr-ring"></div><div class="dr-sparks"><i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i><i class="spark"></i></div></div></div>';
    }
    if(getComputedStyle(host).position==='static') host.style.position='relative';
    if(box.parentElement!==host) host.appendChild(box);
    box.style.position='absolute';
    box.style.left='0';
    box.style.top='0';
    box.style.width='100%';
    box.style.height='100%';
    box.style.zIndex='20';
    box.style.pointerEvents='none';
    initRocketTgs(box);
    positionRocketBox();
    setRocketPosition(1);
  }
  function unmount(){const b=document.getElementById('dur-live-rocket');if(b)destroyRocketTgs(b);b?.remove();document.getElementById('dur-live-rocket-style')?.remove()}
  function setRocketPosition(mult){
    const box=document.getElementById('dur-live-rocket');if(!box)return;
    // The reference rocket is anchored in the center of the game area.
    // Multiplier changes must not move the image left/right/up/down.
    box.style.setProperty('--rx','50%');
    box.style.setProperty('--ry','52%');
  }

  function showFlying(mult){
    const box=document.getElementById('dur-live-rocket');if(!box)return;
    box.classList.remove('crashed','preflight-hidden','dur-rocket-hidden');
    box.classList.add('flying');
    setRocketPosition(mult||1);
  }
  function hideRocket(){
    const box=document.getElementById('dur-live-rocket');if(!box)return;
    box.classList.remove('flying','crashed');
    box.classList.add('preflight-hidden','dur-rocket-hidden');
    box.style.setProperty('--rx','50%');
    box.style.setProperty('--ry','52%');
  }
  let durCrashSerial=0;
  let durLastMultiplier=1;
  let durRocketRoundPhase='';
  // Prepare exactly one random rocket for the next round. It is selected
  // after the crash (or during an initial countdown) and stays hidden until
  // the next flying phase begins.
  let durNextRocketPrepared=false;
  function prepareNextRocket(reason=''){
    if(durNextRocketPrepared) return durCurrentRocketAsset;
    const nextRocket=chooseNextStellarRocket();
    durNextRocketPrepared=true;
    setRocketAsset(nextRocket);
    console.log('[Stellar Rocket] Next round rocket:',nextRocket,reason?`(${reason})`:'');
    return nextRocket;
  }
  function removeDurCrashFx(){
    const box=document.getElementById('dur-live-rocket'); if(!box)return;
    box.querySelectorAll('.dur-final-boom,.dur-final-number').forEach(x=>x.remove());
    box.classList.remove('dur-final-crash','dur-countdown-clean');
    const r=box.querySelector('.dr-rocket');
    if(r){r.style.removeProperty('opacity');r.style.removeProperty('visibility');r.style.removeProperty('animation');}
  }
  function crashFx(packet){
    // Select the next round immediately after this explosion. The new rocket
    // stays hidden through the crash/countdown and is shown on the next flight.
    prepareNextRocket('after crash');
    const box=document.getElementById('dur-live-rocket'); if(!box)return;
    const rocket=box.querySelector('.dr-rocket'); if(!rocket)return;
    const serial=++durCrashSerial;
    const mult=Number(packet?.multiplier ?? durLastMultiplier ?? 0);
    durLastMultiplier=Number.isFinite(mult)?mult:0;
    removeDurCrashFx();
    box.classList.add('dur-final-crash','dur-rocket-hidden');
    rocket.style.setProperty('opacity','0','important');
    rocket.style.setProperty('visibility','hidden','important');
    rocket.style.setProperty('animation','none','important');
    // 0.5s after the rocket disappears: one golden star/space explosion + haptic together.
    setTimeout(()=>{
      if(serial!==durCrashSerial)return;
      const boom=document.createElement('div');
      boom.className='dur-final-boom';
      boom.innerHTML='<span class="flash"></span><span class="core"></span>'+
        Array.from({length:12},(_,i)=>`<i class="ray" style="--a:${i*30}deg"></i>`).join('')+
        Array.from({length:18},(_,i)=>{const a=(i/18)*Math.PI*2,rad=55+(i%5)*15;return `<i class="particle" style="--dx:${Math.cos(a)*rad}px;--dy:${Math.sin(a)*rad}px"></i>`}).join('');
      box.appendChild(boom);
      // Haptics are allowed only while the user is actively inside the Rocket page.
      // PVP and all other pages must never vibrate when the shared round crashes.
      const rocketPageActive = (location.pathname === '/rocket' || location.pathname === '/ton-rocket') && !document.hidden && !!document.getElementById('dur-live-rocket') && document.getElementById('dur-live-rocket').getClientRects().length > 0;
      if (rocketPageActive) {
        try{window.Telegram?.WebApp?.HapticFeedback?.impactOccurred?.('light')}catch(_){ }
        try{navigator.vibrate?.([45])}catch(_){ }
      }
      // 1s after the explosion starts, reveal the final multiplier.
      setTimeout(()=>{
        if(serial!==durCrashSerial)return;
        const n=document.createElement('div');
        n.className='dur-final-number';
        n.textContent=(Number.isFinite(durLastMultiplier)?durLastMultiplier:0).toFixed(2)+'x';
        box.appendChild(n);
        setTimeout(()=>{ if(serial===durCrashSerial) n.remove(); },1000);
      },1000);
    },500);
  }
  window.addEventListener('dur-rocket-ws',e=>{
    try{ if(typeof handlePacket==='function') handlePacket(e.detail); }catch(e){}
  });

  window.addEventListener('dur-rocket-ws',e=>{ try{ const d=typeof e.detail==='string'?JSON.parse(e.detail):e.detail; if(!d)return; if(d.type==='multiplier_update'&&d.multiplier!=null){durLastMultiplier=Number(d.multiplier);showFlying(d.multiplier);} if(d.type==='crash') crashFx(d); if(d.type==='state_snapshot'){const ph=d.state?.phase;if(ph==='countdown'){if(!durNextRocketPrepared)prepareNextRocket('initial countdown');removeDurCrashFx();hideRocket();const countdownBox=document.getElementById('dur-live-rocket');if(countdownBox)countdownBox.classList.add('dur-countdown-clean');} if(ph==='flying'){durNextRocketPrepared=false;removeDurCrashFx();showFlying(d.state?.multiplier||1);}} if(d.type==='phase_change'&&d.phase==='countdown'){
      // Normally the preceding crash already prepared the next rocket.
      // If the app joined during countdown, prepare one here instead.
      if(durRocketRoundPhase!=='countdown' && !durNextRocketPrepared) prepareNextRocket('countdown');
      durRocketRoundPhase='countdown';
      removeDurCrashFx();hideRocket();const countdownBox=document.getElementById('dur-live-rocket');if(countdownBox)countdownBox.classList.add('dur-countdown-clean');
    } if(d.type==='phase_change'&&d.phase==='flying'){
      durRocketRoundPhase='flying';
      durNextRocketPrepared=false;
      removeDurCrashFx();showFlying(d.multiplier||1);
    } if(d.type==='phase_change'&&d.phase==='crashed'){
      durRocketRoundPhase='crashed';
    } }catch(_){} },true);

  mountRocket();
  if(window.v35RocketState) window.v35RocketState.hide();
  else hideRocket();

  window.addEventListener('popstate',()=>{closePage();unmount();mountRocket();replaceGiftTitle();updateNavActive();if(location.pathname==='/backpack')openBackpack(false);else if(location.pathname==='/invite')openInvite(false);else if(location.pathname==='/leaderboard')openLeaderboard(false);else if(location.pathname==='/deposit'||location.pathname==='/topup')openDeposit(false);else if(location.pathname==='/developer'||location.pathname.startsWith('/developer/'))openDev(false);});
  window.addEventListener('resize',positionRocketBox);
  replaceGiftTitle();

  new MutationObserver(()=>{
    if(pathOk()){ mountRocket(); positionRocketBox(); }
    else if(document.getElementById('dur-live-rocket')) unmount();
    replaceGiftTitle();
  }).observe(document.documentElement,{subtree:true,childList:true});


})();
</script>

<script id="dur-reward-sheet-controller">
(function(){
  let currentAward=null,busy=false;
  function hideNative(){
    const b=document.querySelector('[data-testid="button-close-gift-dialog"]');
    if(!b)return;
    let p=b;
    for(let i=0;i<10&&p;i++,p=p.parentElement){
      const cs=getComputedStyle(p);
      if(cs.position==='fixed'||String(p.className||'').includes('fixed')){
        p.style.setProperty('display','none','important');break;
      }
    }
  }
  function sheet(){
    let s=document.getElementById('dur-reward-sheet');
    if(s)return s;
    s=document.createElement('div');s.id='dur-reward-sheet';
    s.innerHTML=
      '<div id="dur-reward-card" role="dialog" aria-modal="true">'+
      '<div id="dur-reward-handle"></div>'+
      '<div id="dur-reward-head"><div id="dur-reward-title">Rocket Reward!</div><button id="dur-reward-close" type="button">×</button></div>'+
      '<div id="dur-reward-subtitle">You won</div>'+
      '<div id="dur-reward-art"><img id="dur-reward-image" alt="Gift"></div>'+
      '<div id="dur-reward-name">Gift</div>'+
      '<div id="dur-reward-random" style="display:none"></div>'+
      '<div id="dur-reward-price">0.00 TON</div>'+
      '<div id="dur-reward-actions"><button id="dur-reward-play" type="button">🚀 Place bet in rocket</button><button id="dur-reward-sell" type="button">$ Sell</button><button id="dur-reward-withdraw" type="button">Withdraw</button></div>'+
      '<div id="dur-reward-status"></div></div>';
    document.body.appendChild(s);
    s.addEventListener('click',e=>{if(e.target===s)close()});
    s.querySelector('#dur-reward-close').onclick=close;
    s.querySelector('#dur-reward-play').onclick=()=>{
      if(busy)return;
      close();
      setTimeout(()=>{},0);
    };
    s.querySelector('#dur-reward-sell').onclick=()=>act('sell');
    s.querySelector('#dur-reward-withdraw').onclick=()=>act('withdraw');
    return s;
  }
  function close(){
    const s=document.getElementById('dur-reward-sheet');if(!s)return;
    s.classList.remove('show');busy=false;
    currentAward=null;
    setTimeout(()=>{if(!s.classList.contains('show'))s.remove()},280);
  }
  async function act(kind){
    if(busy||!currentAward?.userGiftId)return;
    busy=true;
    const s=sheet(),st=s.querySelector('#dur-reward-status');
    const a=s.querySelector('#dur-reward-sell'),w=s.querySelector('#dur-reward-withdraw');
    a.disabled=w.disabled=true;
    st.textContent=kind==='sell'?'Selling…':'Keeping…';
    try{
      const init=window.Telegram?.WebApp?.initData||'';
      const r=await fetch('/api/gifts/'+encodeURIComponent(currentAward.userGiftId)+'/'+kind,{
        method:'POST',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':init},credentials:'include'
      });
      const d=await r.json().catch(()=>({}));
      if(!r.ok||!d.success)throw new Error(d.error||'Request failed');
      if(d.balanceTON!=null)window.dispatchEvent(new CustomEvent('dur-local-balance',{detail:{balance:d.balanceTON}}));
      currentAward=null;close();
    }catch(e){
      st.textContent=e.message||'Could not complete';busy=false;a.disabled=w.disabled=false;
    }
  }
  async function show(a){
    if(!a)return;
    try{await (window.__durGiftPricesReady||Promise.resolve())}catch(_){}
    // Every gift result (Onyx Black, Black, or Normal/Random) must open the same reward sheet.
    // Some normal-gift paths do not include awardId, so create a stable temporary key from round/user gift.
    const normalized={...a};
    normalized.awardId=String(a.awardId||a.userGiftId||a.roundKey||(`gift-result-${Date.now()}`));
    const existingSheet=document.getElementById('dur-reward-sheet');
    if(currentAward?.awardId===normalized.awardId && existingSheet?.classList.contains('show')){
      currentAward={...currentAward,...normalized};
      return;
    }
    currentAward=normalized;
    const s=sheet(),img=s.querySelector('#dur-reward-image');
    img.src=a.giftImageUrl||a.giftImageData||'';
    const giftName=String(a.giftName||'Gift');
    s.querySelector('#dur-reward-name').textContent=giftName;
    const price=Number(a.winAmountTon??a.giftPriceTon??0);
    s.querySelector('#dur-reward-price').textContent=(Number.isFinite(price)?price:0).toFixed(2)+' TON';

    // Reward tier must describe the gift that was actually won. Prefer the
    // server's exact tier metadata, then fall back to the same strict
    // gift_prices.json name + price comparison used by the live gift UI.
    const tierEl=s.querySelector('#dur-reward-random');
    const currentGiftPrice=a.giftTierPriceTon??a.giftCatalogPriceTon;
    const rewardTier=window.__durResolveGiftTier(giftName,currentGiftPrice);
    tierEl.classList.remove('dur-tier-onyx','dur-tier-black');
    tierEl.textContent=rewardTier==='onyx_black'?'Onyx Black':rewardTier==='black'?'Black':'Random';
    tierEl.style.display='';
    if(rewardTier==='onyx_black')tierEl.classList.add('dur-tier-onyx');
    if(rewardTier==='black')tierEl.classList.add('dur-tier-black');
    s.querySelector('#dur-reward-status').textContent='';
    s.querySelector('#dur-reward-sell').disabled=s.querySelector('#dur-reward-withdraw').disabled=false;
    hideNative();s.classList.add('show');
    setTimeout(hideNative,30);setTimeout(hideNative,180);
  }
  window.addEventListener('dur-rocket-ws',e=>{
    try{
      const d=typeof e.detail==='string'?JSON.parse(e.detail):e.detail;
      // Every real gift result opens the reward sheet, regardless of tier or price.
      if(d?.type==='gift_won'||d?.type==='gift_won_ready'||d?.type==='player_won_gift'){
        if(d.userGiftId||d.awardId) show(d);
      }
      // The cash-out acknowledgement is another authoritative source when the
      // reward event arrives a moment later. Never manufacture a reward from
      // an older inventory item when this response contains no award.
      if(d?.type==='cash_out_response' && d.success && d.award?.userGiftId){
        show(d.award);
      }
    }catch(_){}
  },true);

  window.addEventListener('dur-rocket-gift-award',e=>{
    try{show(typeof e.detail==='string'?JSON.parse(e.detail):e.detail)}catch(_){}
  },true);
})();
</script>

  overflow-x:hidden!important;
  max-height:35vh!important;
  min-height:88px!important;
  touch-action:pan-y!important;

<script id="dur-gift-scroll-controller">
(function(){
  function wire(){
    document.querySelectorAll('div.overflow-y-auto,div[class*="overflow-y-auto"],div[style*="max-height"]').forEach(el=>{
      if(el.dataset.durGiftScroll==='1') return;
      const buttons=[...el.querySelectorAll('button')];
      const hasGiftCards=buttons.length>=2 && buttons.some(b=>b.querySelector('img'));
      if(!hasGiftCards) return;
      el.dataset.durGiftScroll='1';
      el.classList.add('dur-gift-scroll');
      el.style.overflowY='auto';
      el.style.overflowX='hidden';
      el.style.touchAction='pan-y';
      el.style.webkitOverflowScrolling='touch';
      el.style.overscrollBehavior='contain';
      el.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
      el.addEventListener('touchmove',e=>e.stopPropagation(),{passive:true});
      el.addEventListener('wheel',e=>e.stopPropagation(),{passive:true});
    });
  }
  wire();
  new MutationObserver(wire).observe(document.documentElement,{subtree:true,childList:true});
  setInterval(wire,800);
})();
</script>

<script id="dur-home-rocket-card-script">
(function(){
  function renderHomeCard(){
    const isHome=location.pathname==='/'||location.pathname==='';
    document.body.classList.toggle('dur-home-view',isHome);
    document.body.classList.toggle('dur-rocket-view',!isHome);

    let wallHost=document.getElementById('dur-home-top-wall-host');
    if(!isHome){
      wallHost?.remove();
      document.getElementById('dur-home-live-strip')?.remove();
      const oldCard=document.getElementById('dur-home-rocket-card');
      if(oldCard?.__durMultiplierLoop){clearInterval(oldCard.__durMultiplierLoop);oldCard.__durMultiplierLoop=null;}
      oldCard?.remove();
      return;
    }
    if(!wallHost){
      wallHost=document.createElement('div');
      wallHost.id='dur-home-top-wall-host';
      const root=document.getElementById('root');
      if(root&&root.parentNode) root.parentNode.insertBefore(wallHost,root);
      else document.body.insertBefore(wallHost,document.body.firstChild);
      if(typeof window.__durBuildTopWall==='function') window.__durBuildTopWall(wallHost);
    }else if(!wallHost.querySelector('#dur-top-wall') && typeof window.__durBuildTopWall==='function'){
      window.__durBuildTopWall(wallHost);
    }

    let live=document.getElementById('dur-home-live-strip');
    if(!live){
      live=document.createElement('div');
      live.id='dur-home-live-strip';
      live.setAttribute('aria-label','Live activity');
      live.innerHTML=`
        <div class="dur-live-label"><span class="dur-live-dot"></span><span>Live</span></div>
        <div class="dur-live-window"><div class="dur-live-track">
          <span class="dur-live-item gift"><img src="/gifts/live_01.png" alt="Genie Lamp"></span>
          <span class="dur-live-item gift alt"><img src="/gifts/live_02.png" alt="Mad Pumpkin"></span>
          <span class="dur-live-item gift green"><img src="/gifts/live_03.png" alt="Love Candle"></span>
          <span class="dur-live-item gift orange"><img src="/gifts/live_04.png" alt="Perfume Bottle"></span>
          <span class="dur-live-item ton"><img src="/assets/ton-sticker-cTLTZuis.webp" alt="TON"></span>
          <span class="dur-live-item gift green"><img src="/gifts/live_05.png" alt="Jelly Bunny"></span>
          <span class="dur-live-item gift"><img src="/gifts/live_06.png" alt="Snake Box"></span>
          <span class="dur-live-item ton"><img src="/assets/ton-sticker-cTLTZuis.webp" alt="TON"></span>
          <span class="dur-live-item gift alt"><img src="/gifts/live_07.png" alt="Whip Cupcake"></span>
          <span class="dur-live-item gift green"><img src="/gifts/live_08.png" alt="Happy Brownie"></span>
          <span class="dur-live-item ton"><img src="/assets/ton-sticker-cTLTZuis.webp" alt="TON"></span>
          <span class="dur-live-item gift orange"><img src="/gifts/live_09.png" alt="Pool Float"></span>
          <span class="dur-live-item gift"><img src="/gifts/live_10.png" alt="Liberty Figure"></span>
          <span class="dur-live-item gift alt"><img src="/gifts/live_11.png" alt="Lunar Snake"></span>
          <span class="dur-live-item ton"><img src="/assets/ton-sticker-cTLTZuis.webp" alt="TON"></span>
          <span class="dur-live-item gift green"><img src="/gifts/live_12.png" alt="Chill Flame"></span>
          <span class="dur-live-item gift"><img src="/gifts/live_01.png" alt="Genie Lamp"></span>
          <span class="dur-live-item ton"><img src="/assets/ton-sticker-cTLTZuis.webp" alt="TON"></span>
          <span class="dur-live-item gift alt"><img src="/gifts/live_05.png" alt="Jelly Bunny"></span>
          <span class="dur-live-item gift orange"><img src="/gifts/live_08.png" alt="Happy Brownie"></span>
        </div></div>`;
      const wall= document.getElementById('dur-home-top-wall-host');
      if(wall) wall.insertAdjacentElement('afterend',live); else document.body.appendChild(live);
    }

    // Keep the live strip and Rocket card in normal flow below the fixed header.
    // The header is fixed and therefore does not reserve space in document flow.
    const syncHeroOffsets=()=>{
      const host=document.getElementById('dur-home-top-wall-host');
      const strip=document.getElementById('dur-home-live-strip');
      if(!host||!strip||!(location.pathname==='/'||location.pathname==='')) return;
      const headerBottom=Math.ceil(host.getBoundingClientRect().bottom);
      strip.style.setProperty('margin-top',Math.max(0,headerBottom+16)+'px','important');
    };
    syncHeroOffsets();
    if(!window.__durHomeHeroOffsetResize){
      window.__durHomeHeroOffsetResize=true;
      window.addEventListener('resize',()=>requestAnimationFrame(()=>{
        const host=document.getElementById('dur-home-top-wall-host');
        const strip=document.getElementById('dur-home-live-strip');
        if(host&&strip&&(location.pathname==='/'||location.pathname==='')) strip.style.setProperty('margin-top',Math.max(0,Math.ceil(host.getBoundingClientRect().bottom)+16)+'px','important');
      }),{passive:true});
    }

    let card=document.getElementById('dur-home-rocket-card');
    if(!card){
      card=document.createElement('button');
      card.type='button'; card.id='dur-home-rocket-card';
      card.setAttribute('aria-label','Open Rocket');
      card.innerHTML=`
        <span class="dur-rb-shape s1"></span><span class="dur-rb-shape s2"></span><span class="dur-rb-shape s3"></span>
        <span class="dur-rb-stars"><i class="dur-rb-star"></i><i class="dur-rb-star"></i><i class="dur-rb-star"></i><i class="dur-rb-star"></i><i class="dur-rb-star"></i><i class="dur-rb-star"></i><i class="dur-rb-star"></i><i class="dur-rb-star"></i></span>
        <span class="dur-rb-hot"><span class="dur-rb-fire">♨</span> HOT</span>
        <span class="dur-rb-title"><span class="dur-rb-title-icon">🚀</span> ROCKET</span>
        <span class="dur-rb-mult m1" data-start="6.71" data-end="8.33">x6.71</span><span class="dur-rb-mult m3" data-start="2.98" data-end="3.79">x2.98</span><span class="dur-rb-mult m4" data-start="2.13" data-end="2.70">x2.13</span>
        <span class="dur-rb-flame"></span>
        <img class="dur-rb-rocket" src="/rocket-static.png?v=3" alt="">
        <span class="dur-rb-spark sp1"></span><span class="dur-rb-spark sp2"></span><span class="dur-rb-spark sp3"></span>
        <span class="dur-rb-hint" aria-hidden="true"></span>`;
      card.addEventListener('click',function(){
        window.history.pushState({},'','/rocket');
        window.dispatchEvent(new PopStateEvent('popstate'));
      });
      const root=document.getElementById('root');
      if(root&&root.parentNode) root.parentNode.insertBefore(card,root);
      else wallHost.after(card);
    }
    startMultiplierAnimations(card);
  }

  function startMultiplierAnimations(card){
    if(card.__durMultiplierLoop) return;
    const items=[
      card.querySelector('.m1'),
      card.querySelector('.m3'),
      card.querySelector('.m4')
    ].filter(Boolean);
    const stepMs=32;
    card.__durMultiplierLoop=setInterval(()=>{
      items.forEach(el=>{
        let value=Number(el.dataset.value || el.dataset.start);
        const end=Number(el.dataset.end);
        if(!Number.isFinite(value)) value=Number(el.dataset.start);
        value+=0.01;
        if(value>end+0.000001) value=Number(el.dataset.start);
        el.dataset.value=value.toFixed(2);
        el.textContent='x'+value.toFixed(2);
      });
    },stepMs);
  }

  window.addEventListener('popstate',renderHomeCard);
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',renderHomeCard,{once:true});
  else renderHomeCard();
  new MutationObserver(renderHomeCard).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>

<script id="dur-home-touch-scroll-controller-v2">
(function(){
  function getHomeContentTop(){
    var host=document.getElementById('dur-home-top-wall-host');
    if(!host) return 210;
    var rect=host.getBoundingClientRect();
    return Math.ceil(Math.max(198,rect.bottom+14));
  }
  function syncHomeScroll(){
    var home=location.pathname==='/'||location.pathname==='';
    document.body.classList.toggle('dur-home-view',home);
    document.documentElement.classList.toggle('dur-home-view',home);
    var root=document.getElementById('root');
    if(root&&home){
      root.style.setProperty('position','fixed','important');
      root.style.setProperty('top',getHomeContentTop()+'px','important');
      root.style.setProperty('bottom','calc(82px + env(safe-area-inset-bottom,0px))','important');
      root.style.setProperty('height','auto','important');
      root.style.setProperty('min-height','0','important');
      root.style.setProperty('max-height','none','important');
      root.style.setProperty('overflow-y','auto','important');
      root.style.setProperty('overflow-x','hidden','important');
      root.style.setProperty('-webkit-overflow-scrolling','touch','important');
      root.style.setProperty('touch-action','pan-y','important');
    } else if(root) {
      ['position','top','bottom','height','min-height','max-height','overflow-y','overflow-x','-webkit-overflow-scrolling','touch-action'].forEach(function(k){root.style.removeProperty(k)});
    }
  }
  syncHomeScroll();
  window.addEventListener('popstate',syncHomeScroll);
  window.addEventListener('resize',syncHomeScroll);
  window.addEventListener('orientationchange',syncHomeScroll);
  new MutationObserver(syncHomeScroll).observe(document.documentElement,{childList:true,subtree:true});
  var push=history.pushState;
  history.pushState=function(){var r=push.apply(this,arguments);syncHomeScroll();return r};
})();
</script>

<script id="dur-home-pvp-card-script">
(function(){
  const names=['MIKE_K','TONNER','APE_KING','PUNK42','DEGEN','MIKE_X','TONNER','APE_KING'];
  const pcts=['7.0%','4.8%','66.7%','4.8%','9.1%','5.0%','5.6%','8.3%'];
  function addPvp(){
    const home=location.pathname==='/'||location.pathname==='';
    const rocket=document.getElementById('dur-home-rocket-card');
    const old=document.getElementById('dur-home-pvp-card');
    if(!home||!rocket){old?.remove();return;}
    if(old){if(old.previousElementSibling!==rocket) rocket.insertAdjacentElement('afterend',old);return;}
    const pvp=document.createElement('button');
    pvp.type='button';pvp.id='dur-home-pvp-card';pvp.setAttribute('aria-label','PVP');
    let players='';
    for(let i=0;i<names.length;i++) players+=`<span class="dur-pvp-player"><img class="dur-pvp-avatar" src="/taq.jpg" alt=""><span class="dur-pvp-name">${names[i]}</span><span class="dur-pvp-pct">${pcts[i]}</span></span>`;
    pvp.innerHTML=`<span class="dur-pvp-shape ps1"></span><span class="dur-pvp-shape ps2"></span><span class="dur-pvp-title"><span class="dur-pvp-title-icon">⚔</span> PVP</span><span class="dur-pvp-window"><span class="dur-pvp-track">${players}${players}</span></span>`;
    rocket.insertAdjacentElement('afterend',pvp);
  }
  window.addEventListener('popstate',addPvp);
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',addPvp,{once:true}); else addPvp();
  new MutationObserver(addPvp).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>

  function orbitEntries(players){

  function weightedSequence(players,count,winnerId){
    if(!players.length)return {items:[],targetIndex:0};
    const winner=players.find(p=>String(p.chatId)===String(winnerId))||players[0];
    // Build a 100-slot visual distribution from the real chances. A player with
    // 1% gets one visual card, 20% gets about twenty, and 80%+ gets many.
    // The winner card is reserved for the final approach, so a 1% winner still
    // appears only once in the visible sequence. Ordering is shuffled randomly.
    const totalChance=players.reduce((sum,p)=>sum+Math.max(0,Number(p.chance)||0),0)||100;
    const raw=players.map(p=>({p,raw:Math.max(0,Number(p.chance)||0)/totalChance*100}));
    const counts=raw.map(x=>Math.floor(x.raw));
    let left=100-counts.reduce((a,b)=>a+b,0);
    raw.map((x,i)=>({i,frac:x.raw-Math.floor(x.raw)})).sort((a,b)=>b.frac-a.frac).forEach(x=>{if(left>0){counts[x.i]++;left--;}});
    // Ensure every positive-chance participant gets a visual appearance.
    raw.forEach((x,i)=>{if(x.raw>0&&counts[i]===0){
      const donor=counts.reduce((best,c,j)=>c>counts[best]?j:best,0);
      if(counts[donor]>1){counts[donor]--;counts[i]++;}
    }});
    // Reserve exactly one winner card for the stopping point.
    const winIndex=players.findIndex(p=>String(p.chatId)===String(winner.chatId));
    if(winIndex>=0&&counts[winIndex]>0)counts[winIndex]--;
    const pool=[];
    players.forEach((p,i)=>{for(let n=0;n<counts[i];n++)pool.push(p)});

    // other participants so the track keeps moving visually after the winner.
    const items=pool;
    items.push(winner);

    const tailPool=players.filter(p=>String(p.chatId)!==String(winner.chatId));

    join.classList.toggle('adding',!!mine&&s.phase==='betting');
    join.textContent=mine?(s.phase==='betting'?'Add Bet':'Joined'):(s.phase==='betting'?'Join the Battle':'Betting closed');

    // Player cards and the orbit are expensive DOM work. Rebuild them only
    // when the actual player/stake list changes, not on every countdown tick.
    const playerSig=String(s.roundKey||'')+'|'+players.map(p=>{
      const gs=Array.isArray(p.giftStakes)?p.giftStakes.map(g=>String(g.id)+':'+Number(g.valueTon||0)).join(','):'';
      return String(p.chatId)+':'+Number(p.betAmount||0)+':'+Number(p.chance||0)+':'+String(p.betType||'')+':'+gs;
    }).join(';');
    if(playerSig!==pvpLastPlayerSig){
      pvpLastPlayerSig=playerSig;
      renderOrbit(players);
      renderPlayers(root,players,s);
    }

    renderRoulette(s,players);
    const miniSig=JSON.stringify([s.lastCompleted||null,s.dailyTop||null,s.history?.[0]||null]);
    if(miniSig!==pvpLastMiniSig){
      pvpLastMiniSig=miniSig;
      renderMiniStats(root,s,players);

          root.dataset.winnerShown=s.roundKey;showWinner(s.winner,s.totalPool,s.roundKey);
        }
        delete root.dataset.winnerPending;
      },600);
    }

  }
  function showBetDetails(p){

    });

    el.querySelector('.dpvp-continue-win').onclick=close;
  }
  function closePvpOverlays(){
    if(pvpModal){pvpModal.remove();pvpModal=null;}
    document.querySelectorAll('#dur-pvp-page .dpvp-winner').forEach(x=>x.remove());
  }
  function closePvp(){
    try{const tg=window.Telegram?.WebApp;if(tg?.BackButton&&window.__durPvpTelegramBack){tg.BackButton.offClick?.(window.__durPvpTelegramBack);window.__durPvpTelegramBack=null;if(location.pathname!=='/rocket'&&location.pathname!=='/ton-rocket'&&location.pathname!=='/free'&&location.pathname!=='/freeton')tg.BackButton.hide()}}catch(_){}
    pvpPageToken++;
    pvpLastPlayerSig='';

  window.__durClosePvp=closePvp;
  async function openBet(){
    if(location.pathname!=='/pvp'||!pvpState||pvpState.phase!=='betting')return;
    const root=document.getElementById('dur-pvp-page');if(!root)return;
    const token=++pvpPageToken;
    closePvpOverlays();
    const mine=(pvpState.players||[]).some(p=>String(p.chatId)===String(user.id));

    pvpModal=document.createElement('div');pvpModal.className='dpvp-modal';
    pvpModal.innerHTML=`<div class="dpvp-modal-card"><div class="dpvp-modal-head"><b>${mine?'Add to your bet':'Place Bet'}</b><button class="dpvp-x">×</button></div><div class="dpvp-tabs"><button class="dpvp-tab" data-tab="ton">TON</button><button class="dpvp-tab active" data-tab="gift">Gifts</button></div><div class="dpvp-tab-body"><div class="dpvp-empty">Loading your gifts…</div></div><button class="dpvp-confirm">${mine?'Add Bet':'Join Battle'}</button><div class="dpvp-note">You can add TON or select multiple gifts in one action. Human players have no upper stake limit.</div></div>`;

    pvpModal.querySelector('.dpvp-confirm').onclick=()=>{
      if(location.pathname!=='/pvp'||token!==pvpPageToken||!pvpModal)return;
      if(currentTab==='ton'){
        const a=Number(pvpModal.querySelector('.dpvp-input')?.value);
        if(!Number.isFinite(a)||a<.1){toast('Enter at least 0.10 TON');return}
        send({type:'place_pvp_bet',betType:'ton',amount:Number(a.toFixed(2)),name:user.first_name||user.username||'Player',username:user.username||'',photoUrl:user.photo_url||''});
      }else{
        if(!selectedGifts.length){toast('Select at least one gift');return}
        send({type:'place_pvp_gifts',giftIds:selectedGifts.map(g=>g.id),name:user.first_name||user.username||'Player',username:user.username||'',photoUrl:user.photo_url||''});
      }
      pvpModal.remove();pvpModal=null;
    };
    const cachedGifts=Array.isArray(window.__durPvpGifts)?window.__durPvpGifts:[];
    drawBetBody(cachedGifts);
    try{
      const d=await api('/api/pvp/me');
      if(location.pathname!=='/pvp'||token!==pvpPageToken||!document.getElementById('dur-pvp-page')||!pvpModal)return;
      const gifts=(d.gifts||[]).filter(g=>Number(g.value_ton||0)>=.1);
      window.__durPvpGifts=gifts;
      drawBetBody(gifts);
    }catch(err){
      if(location.pathname!=='/pvp'||token!==pvpPageToken||!pvpModal)return;
      const body=pvpModal.querySelector('.dpvp-tab-body');if(body)body.innerHTML='<div class="dpvp-empty">Could not load gifts. You can still use TON.</div>';
      drawBetBody(window.__durPvpGifts||[]);
    }
  }
  function updateGiftConfirm(gifts){
    if(!pvpModal)return;
    const btn=pvpModal.querySelector('.dpvp-confirm');
    if(currentTab!=='gift')return;
    const total=selectedGifts.reduce((sum,g)=>sum+Number(g.value_ton||0),0);
    const mine=(pvpState?.players||[]).some(p=>String(p.chatId)===String(user.id));
    btn.textContent=selectedGifts.length?(mine?`Add Bet ( ${money(total)} TON )`:`Join Battle ( ${money(total)} TON )`):(mine?'Add Bet':'Join Battle');
    const all=(gifts.length>0&&selectedGifts.length===gifts.length);
    const sa=pvpModal.querySelector('.dpvp-gift-selectall');
    if(sa)sa.classList.toggle('active',all),sa.querySelector('.dpvp-gift-total').textContent=selectedGifts.length?`${selectedGifts.length} selected · ${money(total)} TON`:'Select all';
  }
  function drawBetBody(gifts){
    const b=pvpModal.querySelector('.dpvp-tab-body');
    if(currentTab==='ton'){
      b.innerHTML='<label class="dpvp-label">Bet amount</label><input class="dpvp-input" type="number" min="0.10" step="0.01" placeholder="0.10 or more">';
      const btn=pvpModal.querySelector('.dpvp-confirm');const mine=(pvpState?.players||[]).some(p=>String(p.chatId)===String(user.id));btn.textContent=mine?'Add Bet':'Join Battle';
      return;
    }
    const selectAll=gifts.length?'<button type="button" class="dpvp-gift-selectall"><b>Select all</b><span class="dpvp-gift-total">Select all</span></button>':'';
    const giftCards=gifts.length?gifts.map(g=>`<button type="button" class="dpvp-gift-opt" data-id="${g.id}"><img src="${esc(g.image_url||g.imageUrl||'')}" alt="" loading="lazy" decoding="async"><b>${esc(g.name)}</b><span>${money(g.value_ton)} TON</span></button>`).join(''):'<div class="dpvp-empty">No eligible gifts</div>';
    b.innerHTML='<label class="dpvp-label">Choose gifts</label><div class="dpvp-gifts">'+selectAll+giftCards+'</div>';
    const allBtn=b.querySelector('.dpvp-gift-selectall');
    if(allBtn) allBtn.onclick=()=>{
      selectedGifts=(selectedGifts.length===gifts.length)?[]:gifts.slice();
      b.querySelectorAll('.dpvp-gift-opt').forEach(el=>el.classList.toggle('selected',selectedGifts.some(g=>String(g.id)===el.dataset.id)));
      updateGiftConfirm(gifts)
    };
    b.querySelectorAll('.dpvp-gift-opt').forEach(el=>el.onclick=()=>{
      const g=gifts.find(x=>String(x.id)===el.dataset.id);if(!g)return;
      const i=selectedGifts.findIndex(x=>String(x.id)===String(g.id));
      if(i>=0)selectedGifts.splice(i,1);else selectedGifts.push(g);
      el.classList.toggle('selected',i<0);updateGiftConfirm(gifts)
    });
    updateGiftConfirm(gifts)
  }
  function winnerGameNo(roundKey){
    const h=String(roundKey||'0').slice(0,8);const n=parseInt(h,16);return String(100000+(Number.isFinite(n)?n%900000:0));
  }
  function showWinner(w,total,roundKey){

<style id="dur-home-smooth-scroll-v1">
html.dur-home-scroll,html.dur-home-scroll body{height:auto!important;min-height:100dvh!important;overflow-x:hidden!important;overflow-y:auto!important;overscroll-behavior-y:contain!important;scroll-behavior:smooth!important;-webkit-overflow-scrolling:touch!important}

html.dur-home-scroll #dur-bottom-nav{position:fixed!important;bottom:0!important}
</style>
<script id="dur-home-smooth-scroll-controller-v1">
(function(){
  function getHomeContentTop(){
    const host=document.getElementById('dur-home-top-wall-host');
    if(!host) return 210;
    const rect=host.getBoundingClientRect();
    return Math.ceil(Math.max(198,rect.bottom+14));
  }
  function syncHomeScroll(){
    const home=location.pathname==='/'||location.pathname==='';
    document.documentElement.classList.toggle('dur-home-scroll',home);
    document.body.classList.toggle('dur-home-scroll',home);
    if(home){
      const root=document.getElementById('root');
      if(root){root.style.setProperty('position','fixed','important');root.style.setProperty('top',getHomeContentTop()+'px','important');root.style.setProperty('bottom','calc(82px + env(safe-area-inset-bottom,0px))','important');root.style.setProperty('height','auto','important');root.style.setProperty('min-height','0','important');root.style.setProperty('max-height','none','important');root.style.setProperty('overflow-y','auto','important');root.style.setProperty('overflow-x','hidden','important');root.style.setProperty('-webkit-overflow-scrolling','touch','important');root.style.setProperty('touch-action','pan-y','important');}
    }
  }
  syncHomeScroll();
  window.addEventListener('popstate',syncHomeScroll);
  const observer=new MutationObserver(syncHomeScroll);
  observer.observe(document.documentElement,{childList:true,subtree:true});
  const originalPushState=history.pushState;
  history.pushState=function(){const result=originalPushState.apply(this,arguments);syncHomeScroll();return result};
})();
</script>
